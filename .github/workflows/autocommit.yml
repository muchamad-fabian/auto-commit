name: Auto commit

on:
  push:
    branches:
      - master

  schedule:
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DEBUG
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          git status

      - name: Generate random skip (30% chance to skip)
        id: random_skip
        run: |
          random=$((RANDOM % 100))

          if [ "$random" -lt 30 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skip commit this time (random probability)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will commit this time"
          fi

      - name: Modify last update
        if: steps.random_skip.outputs.skip == 'false'
        run: |
          d=$(date '+%Y-%m-%dT%H:%M:%SZ')
          echo "$d" > LAST_UPDATED

      - name: Commit changes
        if: steps.random_skip.outputs.skip == 'false'
        run: |
          git config user.email "fabianskiip@gmail.com"
          git config user.name "Muchamad Fabian"

          git add -A

          arr=(
            "chore(bot): 😂 auto commit"
            "chore(bot): 😱 auto commit"
            "chore(bot): 👿 auto commit"
            "chore(bot): 💩 auto commit"
            "chore(bot): 🙏 auto commit"
            "chore(bot): 🙈 auto commit"
            "chore(bot): 🐐 auto commit"
            "chore(bot): 🤖 auto commit"
            "chore(bot): 🟩 auto commit"
            "chore(bot): 👻 auto commit"
            "chore(bot): 💚 auto commit"
            "chore(bot): 🎉 auto commit"
            "chore(bot): 🚀 auto commit"
            "chore(bot): ⭐ auto commit"
            "chore(bot): 🔥 auto commit"
          )

          rand=$((RANDOM % ${#arr[@]}))

          git commit -m "${arr[$rand]}"

      - name: Push changes
        if: steps.random_skip.outputs.skip == 'false'
        run: |
          git push origin HEAD:master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
